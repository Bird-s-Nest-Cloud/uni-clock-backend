{% extends 'admin/layouts/base.html' %}
{% load static %}

{% block content %}
<div class="page-content">
    <div class="container-xxl">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body p-4 text-center">
                        <div class="mb-4">
                            <i class="iconoir-warning-triangle text-danger" style="font-size: 64px;"></i>
                        </div>
                        <h4 class="mb-3">Delete Page?</h4>
                        <p class="text-muted mb-4">Are you sure you want to delete <strong>"{{ page.title }}"</strong>? This action cannot be undone.</p>
                        
                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-2">
                                <a href="{% url 'dashboard:page_list' %}" class="btn btn-secondary">Cancel</a>
                                <button type="submit" class="btn btn-danger">Confirm Delete</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
